{% extends "base.html" %}
{% block title %}Login · Relay Hub{% endblock %}
{% block login_body %}
<div class="login-page">
  <div class="card shadow" style="width: min(420px, 92vw)">
    <div class="card-body p-4">
      <div class="mb-3">
        <h1 class="h4 mb-1">Relay Hub</h1>
        <p class="text-secondary mb-0">Sign in to the fleet hub</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label" for="password">Admin password</label>
          <input class="form-control" id="password" type="password" name="password" required autofocus>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
