<header class="topbar d-flex align-items-center justify-content-between gap-2 flex-wrap">
  <div>
    <div class="fw-semibold">{% block page_title %}Dashboard{% endblock %}</div>
    <div class="text-secondary small">{% block page_subtitle %}{% endblock %}</div>
  </div>
  <div class="d-flex align-items-center gap-2">
    {% block topbar_actions %}{% endblock %}
    <form method="post" action="/logout" class="m-0">
      <button class="btn btn-outline-secondary btn-sm" type="submit">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </form>
  </div>
</header>
